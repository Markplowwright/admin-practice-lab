<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Practice Lab: Microsoft 365, Entra, Intune, Exchange</title>
<style>
:root{
  --bg:#ffffff;--page:#f5f5f5;--panel:#ffffff;--ink:#242424;--muted:#616161;--line:#e0e0e0;--line2:#c7c7c7;
  --hover:#f5f5f5;--sel:#ebf3fc;--brand:#0f6cbd;--brandh:#115ea3;--navbg:#fafafa;
  --ok:#107c10;--warn:#8a5a00;--bad:#b10e1c;--okbg:#dff6dd;--warnbg:#fff4ce;--badbg:#fde7e9;--infobg:#ebf3fc;
  --hdr-blue:#0f6cbd;--hdr-dark:#1b1a19;--lab:#2b2b2b;--shadow:0 8px 24px rgba(0,0,0,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f1f1f;--page:#141414;--panel:#292929;--ink:#f5f5f5;--muted:#adadad;--line:#3d3d3d;--line2:#575757;
    --hover:#333333;--sel:#14304d;--brand:#479ef5;--brandh:#62abf5;--navbg:#1a1a1a;
    --ok:#6ccb5f;--warn:#f7c04a;--bad:#ff8a95;--okbg:#14301a;--warnbg:#3d2f0a;--badbg:#431a1f;--infobg:#14304d;
    --hdr-blue:#0f548c;--hdr-dark:#0a0a0a;--lab:#000;--shadow:0 8px 24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1f1f1f;--page:#141414;--panel:#292929;--ink:#f5f5f5;--muted:#adadad;--line:#3d3d3d;--line2:#575757;
  --hover:#333333;--sel:#14304d;--brand:#479ef5;--brandh:#62abf5;--navbg:#1a1a1a;
  --ok:#6ccb5f;--warn:#f7c04a;--bad:#ff8a95;--okbg:#14301a;--warnbg:#3d2f0a;--badbg:#431a1f;--infobg:#14304d;
  --hdr-blue:#0f548c;--hdr-dark:#0a0a0a;--lab:#000;--shadow:0 8px 24px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/20px "Segoe UI","Segoe UI Web (West European)",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
#app{min-height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

/* practice lab strip */
.lab{background:var(--lab);color:#fff;display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;overflow-x:auto;white-space:nowrap}
.lab b{background:#ffb900;color:#000;padding:0 6px;border-radius:3px;font-weight:600;margin-right:4px}
.lab button{background:none;border:1px solid transparent;color:#fff;padding:3px 10px;border-radius:3px;font-size:12px}
.lab button:hover{background:#ffffff22}
.lab button[aria-current="true"]{border-color:#fff8;background:#ffffff1f}
.lab .sp{flex:1}
.lab .introbtn{border-color:#ffb900;color:#ffb900;font-weight:600;margin-right:8px}
.lab .introbtn:hover{background:#ffb90033}

/* portal header */
.phdr{display:flex;align-items:center;gap:10px;color:#fff;height:48px;padding:0 12px}
body[data-portal="m365"] .phdr,body[data-portal="exchange"] .phdr{background:var(--hdr-blue)}
body[data-portal="entra"] .phdr,body[data-portal="intune"] .phdr{background:var(--hdr-dark)}
.phdr .waf{display:grid;place-items:center;width:32px;height:32px}
.phdr h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap}
.phdr .search{flex:1;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#ffffff26;border-radius:4px;padding:5px 10px;color:#ffffffd0;min-width:0}
.phdr .search span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phdr .av{width:30px;height:30px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

/* shell */
.shell{display:flex;flex:1;min-height:0}
.lnav{width:240px;flex:none;background:var(--navbg);border-right:1px solid var(--line);padding:8px 0;overflow-y:auto}
.lnav .grp{display:flex;align-items:center;gap:10px;padding:8px 16px;font-weight:600;color:var(--ink)}
.lnav .sepl{padding:12px 16px 4px;font-size:12px;color:var(--muted)}
.lnav button.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 16px;border-left:3px solid transparent;color:var(--ink)}
.lnav button.it.kid{padding-left:42px}
.lnav button.it:hover{background:var(--hover)}
.lnav button.it[aria-current="true"]{background:var(--sel);border-left-color:var(--brand);font-weight:600}
.content{flex:1;min-width:0;background:var(--bg);padding:16px 24px 80px;overflow-x:hidden}
.crumbs{color:var(--muted);font-size:12px;margin-bottom:4px}
.crumbs button{background:none;border:0;padding:0;color:var(--brand)}
.ptitle{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:20px;line-height:28px;font-weight:600}
.psub{color:var(--muted);margin:0 0 12px;max-width:760px}
.cmdbar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0;margin:8px 0 12px}
.cmdbar .cb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-radius:4px;padding:6px 10px;white-space:nowrap}
.cmdbar .cb:hover:not(:disabled){background:var(--hover)}
.cmdbar .cb:disabled{color:var(--line2);cursor:not-allowed}
.cmdbar .cb .ic{color:var(--brand)}
.cmdbar .cb:disabled .ic{color:var(--line2)}
.cmdbar .vr{width:1px;height:20px;background:var(--line);margin:0 4px}
.cmdbar .lab-only{border:1px dashed #ffb900}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-bottom-color:var(--ink);border-radius:4px;padding:0 8px;height:32px;max-width:340px;background:var(--panel);margin:0 0 10px}
.srch input{border:0;background:none;outline:none;flex:1;min-width:0}
.srch:focus-within{outline:2px solid var(--brand);outline-offset:1px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
tbody tr.on td{background:var(--sel)}
.ck{width:36px;padding-right:0}
.lnk{background:none;border:0;padding:0;color:var(--brand);text-align:left}
.lnk:hover{text-decoration:underline}
.empty{padding:20px;color:var(--muted);border:1px solid var(--line);border-radius:4px}

/* buttons, badges, fields */
.btn{border:1px solid var(--line2);background:var(--panel);padding:5px 14px;border-radius:4px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brandh)}
:root[data-theme="dark"] .btn.primary{color:#0a0a0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0a0a0a}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:24px;padding:1px 10px;font-weight:400}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;line-height:18px;background:var(--hover);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.msg{padding:8px 12px;border-radius:4px;margin:8px 0;background:var(--infobg);border:1px solid var(--line)}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.warn{background:var(--warnbg);color:var(--ink)}
.msg.ok{background:var(--okbg)}
.i{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;border:1.3px solid var(--brand);border-radius:50%;background:none;color:var(--brand);font:italic 700 10px/1 Georgia,serif;padding:0;vertical-align:middle}
.i:hover,.i[aria-expanded="true"]{background:var(--brand);color:#fff}
#pop{position:absolute;z-index:40;max-width:320px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px}
#pop[hidden]{display:none}
#pop b{display:block;margin-bottom:4px}
#pop p{margin:0 0 6px;font-size:13px;line-height:19px}
#pop .eq{color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:6px;font-size:12px}
.grid2{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;max-width:760px}
.grid2 dt{color:var(--muted)}
.grid2 dd{margin:0;word-break:break-word}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--panel)}
.tile h3{margin:0 0 6px;font-size:14px;font-weight:600}
.tile .big{font-size:28px;line-height:36px;font-weight:600}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--brand)}

/* blade (detail page) */
.blade{display:flex;gap:20px;align-items:flex-start;margin-top:8px}
.bnav{width:210px;flex:none;border-right:1px solid var(--line);padding-right:8px}
.bnav button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-left:3px solid transparent}
.bnav button:hover{background:var(--hover)}
.bnav button[aria-current="true"]{background:var(--sel);border-left-color:var(--brand);font-weight:600}
.bbody{flex:1;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;white-space:nowrap}
.tabs button[aria-current="true"]{border-bottom-color:var(--brand);font-weight:600}
h2.sec{font-size:16px;font-weight:600;margin:18px 0 8px}

/* flyout */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.fly{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.fly header{display:flex;align-items:flex-start;gap:8px;padding:16px 20px 0}
.fly header h2{flex:1;margin:0;font-size:18px;line-height:26px;font-weight:600}
.fly header .x{background:none;border:0;padding:4px}
.fly .fsub{padding:0 20px;color:var(--muted)}
.fly .ftabs{padding:0 12px}
.fly .fbody{padding:8px 20px 24px;overflow-y:auto;flex:1}

/* wizard + forms */
.wtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 16px;overflow-x:auto}
.wtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;white-space:nowrap}
.wtabs button.on{border-bottom-color:var(--brand);font-weight:600}
.wbody{max-width:640px}
.wfoot{display:flex;gap:8px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);max-width:640px;flex-wrap:wrap}
.fld{margin:0 0 14px}
.fld .lb{font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld select{width:100%;max-width:420px;height:32px;padding:0 8px;border:1px solid var(--line2);border-bottom-color:var(--ink);border-radius:4px;background:var(--panel)}
.fld .hint{color:var(--muted);font-size:12px;margin-top:3px}
.fld .rad{display:flex;align-items:center;gap:8px;margin:4px 0}
.fld .chk{display:flex;align-items:center;gap:8px}
.pwbox{font-family:Consolas,"Cascadia Mono",monospace;background:var(--hover);padding:6px 10px;border-radius:4px;display:inline-block}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border-radius:8px;padding:20px 24px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 12px;font-size:18px;line-height:26px}
.merr{color:var(--bad);margin:0;min-height:20px}
.sheet .btnrow{justify-content:flex-end}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-left:4px solid var(--brand);padding:10px 16px;border-radius:4px;box-shadow:var(--shadow);max-width:92vw;z-index:60}
#toast[hidden]{display:none}

/* lab guide drawer */
.gbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#ffb900;color:#000;border:0;border-radius:20px;padding:8px 16px;font-weight:600;box-shadow:var(--shadow)}
.guide{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:35;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.guide header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.guide header h2{flex:1;margin:0;font-size:16px}
.guide .gb{overflow-y:auto;padding:8px 16px 24px;flex:1}
.guide .x{background:none;border:0;padding:4px}
.mis{border-top:1px solid var(--line);padding:10px 0}
.mis h3{margin:0 0 2px;font-size:14px}
.mis p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.mis ul{list-style:none;margin:0;padding:0}
.mis li{display:flex;gap:8px;padding:2px 0;font-size:13px}
.mis li i{flex:none;width:16px;height:16px;border:1.5px solid var(--line2);border-radius:50%;margin-top:2px;font-style:normal;text-align:center;font-size:10px;line-height:13px}
.mis li.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.mis li.on .st{color:var(--muted);text-decoration:line-through}
.mis li div{min-width:0}
.mis .st{display:block}
.mis .wh{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.mis .tools{font-size:12px;margin:0 0 4px}
.tag{display:inline-block;font-weight:600;font-size:11px;line-height:16px;padding:0 6px;border-radius:3px;color:#fff;white-space:nowrap}
.tag.m365,.tag.exchange{background:#0f6cbd}
.tag.entra{background:#0a6a62}
.tag.intune{background:#6446b0}
.map{background:var(--infobg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;margin:4px 0 10px;line-height:19px}
.mis.done h3::after{content:" (done)";color:var(--ok);font-weight:400}
.gl dt{font-weight:600;margin-top:10px}
.gl dd{margin:2px 0 0;color:var(--muted);font-size:13px}

/* levels, explanations, equivalents */
.lvl{margin:14px 0 0}
.lvl>h3{margin:0;font-size:15px;display:flex;align-items:baseline;gap:8px}
.lvl>h3 .ct{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.lvl.done>h3 .ct{color:var(--ok);font-weight:600}
.lvl>p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.lvl .meter{height:4px}
.badge{display:inline-block;font-size:11px;font-weight:600;line-height:16px;padding:0 6px;border-radius:3px;background:#ffb900;color:#000;margin-left:6px;vertical-align:1px}
.why{background:var(--infobg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0 2px;font-size:13px;line-height:19px}
.why b{display:block;margin-bottom:2px}
.why p{margin:0 0 6px;color:var(--ink)}
.why p.eq{margin:0;color:var(--muted)}
.fin{background:var(--okbg);border:1px solid var(--ok);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:13px}
.fin b{display:block;margin-bottom:4px}
.eqn{font-size:13px;color:var(--muted);margin:6px 0 0}
.eql dt{font-weight:600;margin-top:12px}
.eql dd{margin:2px 0 0;font-size:13px;color:var(--muted)}
.eql dd b{color:var(--ink);font-weight:600}

/* welcome page */
.welcome{position:fixed;inset:0;z-index:80;overflow:auto;background:var(--bg);color:var(--ink)}
.whero{position:relative;background:linear-gradient(135deg,#0b3d6e 0%,#0f6cbd 55%,#4a63d8 100%);color:#fff;padding:56px 24px 44px;text-align:center}
.whero .wi{max-width:760px;margin:0 auto}
.wbadge{display:inline-block;background:#ffffff26;border:1px solid #ffffff55;border-radius:999px;padding:2px 12px;font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:16px}
.whero h1{margin:0 0 14px;font-size:clamp(26px,5vw,42px);line-height:1.15;font-weight:600}
.whero p{margin:0 auto 24px;font-size:clamp(15px,2.4vw,18px);line-height:1.5;max-width:620px;color:#e8f1fb}
.wcta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.welcome .btn.big{min-height:46px;padding:8px 24px;font-size:16px;border-radius:6px}
.welcome .whero .btn.primary{background:#ffb900;border-color:#ffb900;color:#1b1a19}
.welcome .whero .btn.primary:hover{background:#ffc83d}
.welcome .whero .btn.ghost{background:transparent;border-color:#ffffffaa;color:#fff}
.welcome .whero .btn.ghost:hover{background:#ffffff1f}
.wstats{list-style:none;display:flex;gap:32px;justify-content:center;flex-wrap:wrap;padding:0;margin:30px 0 0}
.wstats li{font-size:13px;color:#d8e8f8}
.wstats b{display:block;font-size:28px;line-height:32px;font-weight:600;color:#fff}
.wx2{position:absolute;top:12px;right:12px;background:#ffffff1f;border:1px solid #ffffff55;color:#fff;border-radius:6px;width:34px;height:34px;display:grid;place-items:center}
.wx2:hover{background:#ffffff40}
.wbody{max-width:980px;margin:0 auto;padding:30px 24px 56px}
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:32px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.wcard .ic{width:26px;height:26px;color:var(--brand);margin-bottom:8px}
.wcard h2{margin:0 0 6px;font-size:16px}
.wcard p{margin:0;color:var(--muted);font-size:14px;line-height:21px}
.wsec{margin:0 0 12px;font-size:20px}
.wpath{list-style:none;padding:0;margin:0 0 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.wpath li{display:flex;gap:10px;align-items:flex-start;background:var(--infobg);border:1px solid var(--line);border-radius:8px;padding:12px}
.wpath .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
:root[data-theme="dark"] .wpath .n{color:#0a0a0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wpath .n{color:#0a0a0a}}
.wpath small{display:block;color:var(--muted);font-size:12px;line-height:17px;margin-top:2px}
.wwhy{background:var(--panel);border:1px solid var(--line);border-left:4px solid #ffb900;border-radius:10px;padding:22px 26px;margin-bottom:24px}
.wwhy h2{margin:0 0 12px;font-size:20px}
.wwhy blockquote{margin:0}
.wwhy p{margin:0 0 12px;font-size:15px;line-height:24px}
.wwhy .wby{margin:14px 0 0;color:var(--muted);font-size:13px}
.wwhy .wby a{color:var(--brand)}
.wfoot{text-align:center;color:var(--muted);font-size:12px;margin:0}

/* tour steps and finish screen */
#intro:empty{display:none}
.introwrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55)}
.intro{background:var(--panel);color:var(--ink);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:580px;max-height:100%;overflow:auto;padding:20px 24px}
.intro .stp{font-size:12px;color:var(--muted);margin:0 0 4px}
.intro h2{margin:0 0 8px;font-size:20px;line-height:28px}
.intro p{margin:0 0 10px}
.intro .dots{display:flex;gap:6px;margin:0 0 14px}

var GL={
tenant:["Tenant","Your organization's dedicated space in Microsoft's cloud. Users, groups, devices and licenses all live inside one tenant, and every admin center manages that same tenant.","Google Admin: your Google Workspace account and domain."],
entra:["Microsoft Entra ID","The cloud identity service. It stores users, groups and devices and decides who can sign in and what they can reach. It used to be called Azure Active Directory.","Google Admin: Directory plus Google sign-in."],
upn:["User principal name (UPN)","The sign-in name, written like an email address (name@domain). It is what people type to sign in.","Google: the primary email address."],

license:["License","Permission to use a paid product, bought per user per month. Business Premium bundles the Microsoft 365 apps, Entra ID P1 and Intune. A license left on a former employee is money wasted.","Google Admin: Billing > Subscriptions."],
grouplic:["Group-based licensing","Assign a license to a group once and every member gets it automatically. Remove someone from the group and the license frees up. Fewer manual steps, fewer mistakes.",""],
secgroup:["Security group","A list of users used to control access and licensing. Membership is usually assigned by an admin.","Google Admin: Groups."],
mfa:["Multifactor authentication (MFA)","A second proof of identity after the password, such as approving a prompt in an authenticator app. It stops most account takeovers even when a password has leaked.","Google Admin: 2-Step Verification."],
secdef:["Security defaults","A free on/off setting that requires MFA registration for everyone and blocks old sign-in methods. It can't be used together with Conditional Access policies.",""],
ca:["Conditional Access","Rules evaluated at sign-in, such as 'require MFA for all users' or 'only from compliant devices'. More flexible than security defaults. Needs Entra ID P1, which Business Premium includes.","Google Admin: Context-Aware Access."],
reportonly:["Report-only","A safe test mode. The policy is evaluated and logged ('would have required MFA') but not enforced. Use it before turning a policy On so you don't lock people out.",""],
signinlogs:["Sign-in logs","A record of each sign-in: who, which app, from where, and whether MFA or Conditional Access applied. The first place to look when you suspect a compromised account.","Google Admin: Reporting > Audit and investigation > Login."],
auditlogs:["Audit logs","A record of admin changes: who created, edited or deleted what, and when.","Google Admin: Reporting > Audit and investigation > Admin."],
revoke:["Revoke sessions","Signs the user out everywhere by invalidating their sign-in tokens. A password reset alone doesn't always end sessions that are already signed in, so do both after a compromise.","Google Admin: Sign out and reset sign-in cookies."],
block:["Block sign-in / Account enabled","Stops new sign-ins without deleting anything. Use it right away when someone leaves, then clean up. Existing sessions may stay valid until revoked.","Google Admin: Suspend user."],
authm:["Authentication methods","The ways a user can prove who they are: authenticator app, phone, email. Attackers sometimes add their own phone number to keep getting in. Remove any method you don't recognize.",""],
rereg:["Require re-register MFA","Clears the user's MFA registration so they must set it up again at next sign-in. Useful when you can't be sure which methods are legitimate.",""],
roles:["Administrator roles","Permissions for managing the tenant. Each person should hold the smallest role that fits their job.","Google Admin: Admin roles."],
least:["Least privilege","Give people only the access they need to do their job, nothing more. In practice: day-to-day admins get a narrow role and very few people hold Global Administrator.",""],
ga:["Global Administrator","Can do everything in the tenant. Microsoft recommends keeping these to a small number of accounts, because one compromised Global Administrator is a total compromise.","Google Admin: Super admin."],
helpdesk:["Helpdesk Administrator","Can reset passwords and sign out non-admin users. A good fit for a support technician who doesn't need to change anything else.",""],
soft:["Deleted users (soft delete)","A deleted user is kept for 30 days and can be restored. After that it is permanently removed. Deleting is the last step of offboarding, after files are handed off and access is cut.","Google Admin: Deleted users."],
mailbox:["Mailbox","The user's Exchange Online mailbox. It stays active only while the user holds a license that includes Exchange. An unlicensed mailbox goes inactive and is deleted after a grace period.",""],
fwd:["Email forwarding","Automatically sends a copy of incoming mail to another address. Attackers set this up after a compromise to quietly collect mail, and it survives password resets. External forwarding you didn't set up is a red flag. (Attackers also create hidden inbox rules, which admins check with PowerShell or the security portal.)","Google Admin: Gmail > user forwarding settings."],
onedrive:["OneDrive file access","A user's work files live in their OneDrive. On offboarding, give the manager a link to the files before deleting the account, or the files are only kept for a limited retention period.",""],
mdm:["MDM (mobile device management)","The management channel that lets Intune configure, secure and wipe a device. A device must be enrolled in MDM before Intune can manage it.","Jamf: MDM enrollment."],
mdmscope:["MDM user scope","Controls whose devices may enroll in Intune automatically when they sign in. If it is None or doesn't include the user, the laptop joins Entra ID but never shows up in Intune. A very common setup mistake.",""],
intune:["Microsoft Intune","The device management service: enroll devices, push settings and apps, check compliance, retire or wipe.","Jamf Pro."],
autopilot:["Windows Autopilot","Zero-touch setup for new Windows PCs. The device is registered by serial number, the user signs in, and the PC configures itself and enrolls in Intune. No manual imaging.","Jamf: Automated Device Enrollment."],
approfile:["Deployment profile","The Autopilot recipe: how setup behaves (for example user-driven, joined to Entra ID). A device with no profile assigned falls back to normal manual Windows setup.","Jamf: PreStage enrollment."],
entrajoin:["Microsoft Entra joined","The PC belongs to the cloud directory instead of an on-premises domain. People sign in with their work account. Typical for cloud-first companies.",""],
compliance:["Compliance policy","Defines what a healthy device looks like, such as BitLocker on and Windows 11. It reports Compliant or Noncompliant and can feed Conditional Access. It doesn't change any settings by itself.","Jamf: smart groups and extension attributes."],
config:["Configuration profile","Settings pushed to devices, like Wi-Fi or password rules. This is what actually makes a setting true on the device.","Jamf: Configuration Profiles."],
bitlocker:["BitLocker","Windows full-disk encryption. If a laptop is lost the data is unreadable without the key. A compliance policy checks it, and a disk encryption policy turns it on.","Mac: FileVault."],

retire:["Retire","Removes company data, apps and settings from the device and releases it from management. Personal files stay. Good for returned equipment you'll re-image.","Jamf: Remove MDM profile."],
wipe:["Wipe","Factory-resets the device and erases everything. Use for lost or stolen devices and before reassigning a laptop.","Jamf: Erase device."],
sync:["Sync","Asks the device to check in with Intune now instead of waiting for its next scheduled check-in.",""],
primary:["Primary user","The person the device is assigned to. Used in reports and for user-targeted policies.",""],
required:["Required app","Installed automatically on devices in the assignment. 'Available' apps are only offered in the Company Portal for users to install themselves.","Jamf: Self Service."],
mailflow:["Mail flow rule","A rule applied to messages as they move through Exchange, such as blocking automatic forwarding to external addresses.",""],
trouble:["Troubleshooting + support","Intune's helpdesk view for one user: account status, license, MDM eligibility, devices and assignment problems in one place.",""],

/* ---------- assignment model ---------- */
function applies(item,userId){
  var a=item.assign||{all:"",groups:[]};
  if(a.all==="users"||a.all==="devices"){return true;}
  var gids=userGroups(userId).map(function(g){return g.id;});
  return a.groups.some(function(g){return gids.indexOf(g)>-1;});
}
function assignText(a){
  if(!a){return "Not assigned";}
  if(a.all==="users"){return "All users";}
  if(a.all==="devices"){return "All devices";}
  if(a.groups&&a.groups.length){return a.groups.map(function(g){return G(g)?G(g).name:"?";}).join(", ");}
  return "Not assigned";
}
function sameScope(a,b){
  var an=a.assign,bn=b.assign;
  if(!an||!bn){return false;}
  var aAll=an.all==="users"||an.all==="devices",bAll=bn.all==="users"||bn.all==="devices";
  if(aAll&&(bAll||bn.groups.length)){return true;}
  if(bAll&&an.groups.length){return true;}
  return an.groups.some(function(g){return bn.groups.indexOf(g)>-1;});
}
function verNum(v){return String(v).split(".").map(function(x){return parseInt(x,10)||0;});}
function verLt(a,b){var x=verNum(a),y=verNum(b);for(var i=0;i<Math.max(x.length,y.length);i++){var p=x[i]||0,q=y[i]||0;if(p<q){return true;}if(p>q){return false;}}return false;}
function inMdmScope(u){
  if(S.mdm.scope==="all"){return true;}
  if(S.mdm.scope==="some"&&S.mdm.group){var g=G(S.mdm.group);return !!g&&g.members.indexOf(u.id)>-1;}
  return false;
}
function recompute(){
  S.devices.forEach(function(d){
    if(d.state!=="enrolled"||!d.userId){d.compl=null;d.appsIn=[];d.cfgIn=[];return;}
    var u=U(d.userId);
    var bit=!!d.baseBitlocker||S.profiles.some(function(p){return p.type==="BitLocker"&&applies(p,d.userId);});
    d.bitlocker=bit;
    var rows=[];
    S.policies.filter(function(p){return applies(p,d.userId);}).forEach(function(p){
      var bad=[];
      if(p.bitlocker&&!bit){bad.push("BitLocker is not enabled");}
      if(p.minOS&&verLt(d.osVer,p.minOS)){bad.push("OS version "+d.osVer+" is below "+p.minOS);}
      rows.push({policy:p.name,state:bad.length?"Not compliant":"Compliant",reason:bad.join("; "),reqBit:!!p.bitlocker});
    });
    var noncomp=rows.some(function(r){return r.state!=="Compliant";});
    d.compl={state:noncomp?"Not compliant":"Compliant",rows:rows,none:!rows.length};
    d.appsIn=S.apps.filter(function(a){return a.intent==="required"&&applies(a,d.userId);}).map(function(a){return a.name;});
    d.cfgIn=S.profiles.filter(function(p){return applies(p,d.userId);}).map(function(p){return p.name;});
    void u;
  });
}

function createUser(name,p,loc,lic){
  name=(name||"").trim();p=(p||"").trim().toLowerCase();
  if(!name){return {error:"Enter a display name."};}
  if(!/^[a-z0-9._-]+$/.test(p)){return {error:"The user principal name can only contain letters, numbers, dots, dashes and underscores."};}
  if(S.users.some(function(u){return u.upn===p;})){return {error:"Another object with the same value for property userPrincipalName already exists."};}
  if(lic&&!loc){return {error:"Select a usage location before assigning a license."};}
  if(lic&&available()<=0){return {error:"No licenses available. Free one up first."};}
  var u={id:nid("u"),name:name,upn:p,loc:loc||"",direct:!!lic,blocked:false,revoked:false,pwReset:false,fwd:null,deleted:false,filesLink:false,roles:[],methods:[],created:true};
  S.users.push(u);S.flags.createdUsers+=1;audit("Add user",u.id);
  u.pw=randPw();u.mustChange=true;return {user:u,pw:u.pw};
}

A.addMethod=function(d){var u=U(d.id);

A.simSignin=function(d){
  var u=U(d.id),good=u.methods.some(function(m){return !m.sus;});
  var caOn=S.caPolicies.some(function(p){return p.state==="on";}),caRep=S.caPolicies.some(function(p){return p.state==="report";});
  var need=S.secDefaults||caOn,status,mfa,ca,note;
  if(u.blocked){status="Failure";mfa="-";ca="Not applied";note="Sign-in failed (50057): the account is disabled.";}
  else if(need&&!good){status="Interrupted";mfa="MFA registration required (50072)";ca=caOn?"Success":"Security defaults";S.flags.testedMfa=true;note=u.name+" has no MFA method, so they are forced to register one before continuing.";}
  else if(need){status="Success";mfa="MFA satisfied (app notification)";ca=caOn?"Success":"Security defaults";note="MFA was required and satisfied.";}
  else{status="Success";mfa="Single-factor authentication";ca=caRep?"Report-only: would require MFA":"Not applied";note="Signed in with a password only. Nothing enforces MFA yet."+(caRep?" The report-only policy logged that it would have required MFA.":"");}
  S.logs.unshift({id:nid("l"),uid:u.id,when:"Just now",app:"Test sign-in",status:status,ip:"73.12.90.4",place:"Brooklyn, United States",ca:ca,mfa:mfa,odd:false});
  toast(note);
};

function dsreg(d){
  var j=d.join==="joined",r=d.join==="registered",u=d.joinUser?U(d.joinUser):null,L=[];
  var mdm=(j&&u&&inMdmScope(u))?"https://enrollment.manage.microsoft.com/enrollmentserver/discovery.svc":"";
  var comp=d.name==="(not set up)"?compNameFor(d):d.name;
  L.push("+----------------------------------------------------------------------+","| Device State                                                         |","+----------------------------------------------------------------------+","");
  L.push("             AzureAdJoined : "+(j?"YES":"NO"),"          EnterpriseJoined : NO","              DomainJoined : NO","               Device Name : "+comp,"");
  if(j){L.push("+----------------------------------------------------------------------+","| Device Details                                                       |","+----------------------------------------------------------------------+","","                  DeviceId : "+guidFor(d),"                TpmProtected : YES","");
    L.push("+----------------------------------------------------------------------+","| Tenant Details                                                       |","+----------------------------------------------------------------------+","","                TenantName : Practice Tenant","                  TenantId : "+TENANT,"                    MdmUrl : "+mdm,"               MdmTouUrl : "+(mdm?"https://portal.manage.microsoft.com/TermsofUse.aspx":""),"");}
  L.push("+----------------------------------------------------------------------+","| User State                                                           |","+----------------------------------------------------------------------+","","                    NgcSet : NO","           WorkplaceJoined : "+(r?"YES":"NO"),"");
  L.push("+----------------------------------------------------------------------+","| SSO State                                                            |","+----------------------------------------------------------------------+","","                AzureAdPrt : "+(j&&d.vm.cur&&d.vm.cur.kind==="work"?"YES":"NO"),"");
  return L;
}
function runCmd(d,line){
  var c=line.trim().toLowerCase(),v=d.vm,out=[],nm=sessName(d),comp=d.name==="(not set up)"?compNameFor(d):d.name;
  if(!c){return out;}
  if(c==="help"){out=["Commands in this lab:","  dsregcmd /status   Show Entra join state","  whoami             Show the signed-in user","  hostname           Show the computer name","  ipconfig [/all]    Show network and DHCP details","  cls                Clear the screen"];}
  else if(c==="dsregcmd /status"||c==="dsregcmd"){out=dsreg(d);if(d.join){S.flags.vmDsreg=true;}}
  else if(c==="whoami"){out=[v.cur&&v.cur.kind==="work"?"azuread\\"+(U(v.cur.uid).name.replace(/\s/g,"").toLowerCase()):comp.toLowerCase()+"\\"+nm.toLowerCase()];}
  else if(c==="hostname"){out=[comp];}
  else if(c==="ipconfig"||c==="ipconfig /all"){
    out=["Windows IP Configuration","","Wireless LAN adapter Wi-Fi:","","   Connection-specific DNS Suffix  . : "+(d.join==="joined"?"practice.local":""),"   IPv4 Address. . . . . . . . . . . : "+ipFor(d),"   Subnet Mask . . . . . . . . . . . : 255.255.255.0","   Default Gateway . . . . . . . . . : 192.168.20.1"];
    if(c==="ipconfig /all"){out.push("   DHCP Enabled. . . . . . . . . . . : Yes","   DHCP Server . . . . . . . . . . . : 192.168.20.1","   Lease Obtained. . . . . . . . . . : Thursday, October 8, 2026 9:12:04 AM","   Lease Expires . . . . . . . . . . : Thursday, October 8, 2026 5:12:04 PM");}
  }else if(c==="cls"){v.cmd=[];return null;}
  else{out=["'"+line.trim().split(" ")[0]+"' is not recognized as an internal or external command,","operable program or batch file."];}
  return out;
}
function cmdHtml(d){
  var v=d.vm,nm=sessName(d),path="C:\\Users\\"+(v.cur&&v.cur.kind==="work"?U(v.cur.uid).name.replace(/\s/g,"").toLowerCase():nm)+">";
  return '<div class="win cmdwin"><div class="tb"><span>Command Prompt</span><button type="button" class="wx" data-a="vmClose" aria-label="Close">&#10005;</button></div><pre class="cmdout">'+esc(v.cmd.join("\n"))+'</pre><div class="cmdin"><span>'+esc(path)+'</span><input type="text" data-vi="cmdin" data-enter="vmCmd" autocomplete="off" aria-label="Command" value="'+esc(S.vmIn.cmdin||"")+'" placeholder="try: dsregcmd /status"><button type="button" class="wbtn pri" data-a="vmCmd">Run</button></div></div>';
}
A.vmCmd=function(){var d=curDev(),v=d.vm,line=S.vmIn.cmdin||"";S.vmIn.cmdin="";if(!line.trim()){return;}
  var nm=sessName(d),path="C:\\Users\\"+(v.cur&&v.cur.kind==="work"?U(v.cur.uid).name.replace(/\s/g,"").toLowerCase():nm)+">";
  var out=runCmd(d,line);if(out===null){return;}
  v.cmd.push(path+line.trim());v.cmd=v.cmd.concat(out);v.cmd.push("");if(v.cmd.length>400){v.cmd=v.cmd.slice(-300);}
};

function vmTip(d){
  var v=d.vm;

var LEVELS=[
  {n:1,name:"Onboarding",d:"Prepare the tenant, bring a new hire online, and learn group licensing."},
  {n:2,name:"Offboarding",d:"Cut access in the right order, keep the files, and shrink admin rights."},

var MMETA={
"Contain a compromised account: Dana Rivera":{l:3,
  why:"Attackers want to stay in. A password reset blocks sign-ins with the old password, but sessions that are already signed in keep working until you revoke them. A phone number the attacker added can reset the password again, and a forwarding rule keeps copying her mail without any sign-in at all. Each one is a different mechanism, so each needs its own step.",
  eq:"Google Admin: reset the password, reset sign-in cookies, remove the recovery phone, check Gmail forwarding. Jamf manages devices, so these identity steps happen in your identity provider."},
"Get Intune ready for new Windows laptops":{l:1,
  why:"Intune only enrolls a laptop automatically when the person who signs in falls inside the MDM user scope. Outside it, the laptop joins Entra ID and never shows up in Intune. The Autopilot deployment profile is the recipe a new PC follows during setup, and a device with no profile falls back to ordinary manual setup. Both are tenant-wide, set once, which is why they come before any laptop.",
  eq:"Jamf: link Apple Business Manager and create a PreStage enrollment. That plays the role of the MDM scope plus the deployment profile."},
"Onboard Priya Nair":{l:1,
  why:"A license can't be assigned until a usage location is set, because some services are restricted by country. Groups give access, and the license (direct or through a group) is what lets her mailbox and Intune enrollment work. If the license or MDM scope is missing, the laptop's setup fails at the work-account sign-in even though her account exists.",
  eq:"Google Admin: create the user, assign a license under Billing, add them to Groups. Jamf: the device side is Automated Device Enrollment."},
"License by group, the scalable way":{l:1,
  why:"Group-based licensing turns onboarding and offboarding into membership changes: add someone to the group and the license follows, remove them and it frees up. The usage location still has to be set on each user, which is why the last step checks for it.",
  eq:"Google Admin: licenses can be applied automatically by organizational unit. Jamf is licensed per managed device, so there is no per-user license to assign."},
"Offboard Sam Ortiz":{l:2,
  why:"The order matters. Block sign-in and sign out sessions first so access ends now. Create the OneDrive link before the account is deleted, because the files are only kept for a limited retention period. Reclaim the license and retire the laptop, and delete the user last, since a deleted user can be restored for 30 days and is permanently removed after that.",
  eq:"Google Admin: suspend the user, transfer Drive and Gmail data, remove the license, wipe or remove the device, then delete. Jamf: Erase Device on a Mac."},
"Apply least privilege: Marcus Lee":{l:2,
  why:"Global Administrator can change anything, so one stolen password on that account is a full compromise of the tenant. Helpdesk Administrator can reset passwords and sign out non-admin users, which is what support work needs. Giving each person the smallest role that fits their job limits the damage of any single compromised account.",
  eq:"Google Admin: custom admin roles, with Super admin kept to a few people. Jamf: privilege sets on console accounts."},
"Require MFA for everyone":{l:3,
  why:"Report-only mode logs what the policy would have done without blocking anyone, so you can find the people it would lock out, such as users with no MFA method registered, before you enforce. Security defaults is the free all-or-nothing option and Conditional Access is the flexible one. They can't be used together.",
  eq:"Google Admin: enforce 2-Step Verification, with Context-Aware Access for finer rules. Jamf: enforce MFA at your identity provider."},
"Enforce BitLocker with Intune":{l:4,
  why:"Two different jobs. A disk encryption policy configures BitLocker on the device, which makes it true. A compliance policy only checks whether it is on and reports Compliant or Noncompliant. If the two are assigned to different groups, the check evaluates laptops that never received the setting.",
  eq:"Jamf: the Mac version is a FileVault configuration profile plus a smart group that checks it is on."},
"Deploy an app":{l:4,
  why:"Required apps install without the user doing anything, while Available apps are only offered in the Company Portal for users to choose. The assignment decides who gets the app, and an app with no assignment does nothing at all.",
  eq:"Jamf: a policy that installs the package, with Self Service for optional apps. Google Admin: force-install apps by organizational unit."},
"Set up Priya's laptop on the virtual Windows PC":{l:4,
  why:"This is the Autopilot flow seen from the PC's side. The errors you can hit on the sign-in screen come from settings you changed in the admin centers: the license, the MDM user scope and the deployment profile. dsregcmd /status is the quickest way to see whether the PC is joined and which MDM URL it received. An empty MdmUrl means the user isn't in the MDM scope.",
  eq:"Jamf: the same moment is Setup Assistant with Automated Device Enrollment. The check command on a Mac is profiles status -type enrollment."},
"Join a spare laptop to Entra by hand":{l:4,
  why:"Joined means the organization owns the PC and people sign in to Windows with their work account. Registered only adds a work account to a personal device, with little control. Joining needs a local administrator on the PC. A joined PC still isn't managed until the user is in the MDM scope and licensed, so joined does not mean managed.",
  eq:"Jamf: this is manual, user-initiated enrollment through the enrollment URL instead of Automated Device Enrollment."}
};

      '<h2 class="wsec">Your learning path</h2><ol class="wpath">'+lv.map(function(L){return '<li><span class="n">'+L.n+'</span><div><b>'+esc(L.name)+'</b><small>'+esc(pd[L.n]||L.d)+'</small></div></li>';}).join("")+'</ol>'+
      '<section class="wwhy" aria-labelledby="whyT"><h2 id="whyT">Why I built this</h2><blockquote>'+
        '<p>Hi, I\'m Mark. When I was learning Microsoft 365 admin work, I kept having to use YouTube to figure out how to do things. I wanted somewhere I could just practice, so I built this to help myself.</p>'+
        '<p>Then I realized that if I had this trouble, a lot of other people must have it too. So I made it free for anyone who is learning the same things.</p></blockquote>'+
        '<p class="wby">Built by Mark. <a href="https://github.com/Markplowwright/admin-practice-lab" target="_blank" rel="noopener">See the project on GitHub</a></p></section>'+
      '<p class="wfoot">This is a learning simulator, not affiliated with or endorsed by Microsoft. Everything in it is fake data. You can come back to this page any time with the Introduction walk through button at the top.</p>'+
    '</div></div>';
}
function introHtml(){
  var n=Math.max(0,Math.min(INTRO_STEPS-1,S.intro||0)),lv=levelsView(),next=nextMission(lv),h="",btns="";
  if(n===0){return welcomeHtml();}
  if(n===1){
    h='<h2 id="introT">Five places you will work</h2><ul class="pl">'+
      ['m365','entra','intune','exchange','vm'].map(function(p){var t={m365:"Everyday people tasks: create users, assign licenses, handle files and mail forwarding.",entra:"Identity and security: sign-in logs, MFA, Conditional Access, roles, groups, and which devices may enroll.",intune:"Device management: Autopilot, compliance and configuration policies, apps, retire and wipe.",exchange:"Email: mailboxes, forwarding and mail flow rules.",vm:"A pretend laptop for the on-device steps: setup screens, joining to Entra, Command Prompt. What you do here shows up in Entra and Intune."}[p];return '<li><b class="tag '+p+'">'+esc(PNAME[p])+'</b> '+esc(t)+'</li>';}).join("")+'</ul><p>They all share one set of users, groups, licenses and devices, just like a real tenant. Change something in one place and the others reflect it.</p>';
    btns='<button type="button" class="btn link" data-a="introSkip">Skip</button><span class="sp"></span><button type="button" class="btn" data-a="introBack">Back</button><button type="button" class="btn primary" data-a="introNext">Next</button>';
  }else if(n===2){
    h='<h2 id="introT">How missions work</h2><ul class="pl"><li>Open the <b>Lab guide</b> with the yellow button at the bottom right. Each mission is a short list of steps.</li><li>Every step names the portal and the menu path, with a <b>Go there</b> button that jumps straight to it.</li><li>A step is checked off when you actually do it in the lab, not when you click it.</li><li>When you finish a mission, the guide explains <b>why it works that way</b>.</li><li>Click the <b>i</b> icons anywhere for plain-English definitions.</li><li>Mistakes are safe. <b>Reset lab</b> in the guide restores the starting state.</li></ul><p class="small">Progress is saved in this browser only.</p>';
    btns='<button type="button" class="btn link" data-a="introSkip">Skip</button><span class="sp"></span><button type="button" class="btn" data-a="introBack">Back</button><button type="button" class="btn primary" data-a="introNext">Next</button>';
  }else{
    var fresh=progress()[0]===0;
    h='<h2 id="introT">Your learning path</h2><ul class="pl">'+lv.map(function(L){return '<li><b>Level '+L.n+': '+esc(L.name)+'</b> ('+L.ms.length+(L.ms.length===1?' mission':' missions')+')<br><span class="small">'+esc(L.d)+'</span></li>';}).join("")+'</ul>'+(next?'<p>'+(fresh?'First up':'Next up')+': <b>'+esc(next.t)+'</b>. '+esc(next.w)+'</p>':'')+'<p class="small">Coming from Jamf or Google Admin? The guide has a Jamf / Google tab that translates the ideas.</p>';
    btns='<span class="sp"></span><button type="button" class="btn" data-a="introBack">Back</button>'+(fresh?'<button type="button" class="btn primary" data-a="introStart">Start Level 1</button>':'<button type="button" class="btn primary" data-a="introStart">Continue where I left off</button>');
  }
  return '<div class="introwrap"><div class="intro" role="dialog" aria-modal="true" aria-labelledby="introT"><div class="stp">Step '+n+' of '+(INTRO_STEPS-1)+'</div>'+dots(n)+h+'<div class="btnrow">'+btns+'</div></div></div>';
}
function finishHtml(){
  var lv=levelsView();
  return '<div class="introwrap"><div class="intro" role="dialog" aria-modal="true" aria-labelledby="finT"><h2 id="finT">You finished Admin Practice Lab</h2><p>All four levels are complete. Here is what you practiced:</p><ul class="pl">'+lv.map(function(L){return '<li><b>Level '+L.n+': '+esc(L.name)+'</b><br><span class="small">'+L.ms.map(function(m){return esc(m.t);}).join("; ")+'</span></li>';}).join("")+'</ul><p>Next, check each procedure against Microsoft\'s current documentation, and try the real thing in a test tenant before you touch a production one. This lab is a simulation, so portal layouts will differ.</p><div class="btnrow"><button type="button" class="btn link" data-a="finishReset">Reset lab to practice again</button><span class="sp"></span><button type="button" class="btn primary" data-a="finishClose">Close</button></div></div></div>';
}

/* =============== ACTIONS (shared) =============== */
function resetNav(){S.sel=null;S.tab=null;S.q="";S.checked=[];S.fly=null;S.wiz=null;S.draft=null;}
A.go=function(d){if(d.g&&window.innerWidth<900){S.guide=false;}if(d.p&&d.p!==S.portal){S.portal=d.p;if(!d.pg){d.pg=DEFAULT[d.p];}}S.page=d.pg||DEFAULT[S.portal];resetNav();if(S.portal==="entra"&&S.page==="signins"){S.flags.viewedLogs=true;}window.scrollTo(0,0);};
A.sel=function(d){S.sel=d.id;S.tab=null;S.checked=[];if(d.id==="u1"&&S.portal==="entra"){S.flags.viewedLogs=true;}};
A.back=function(){S.sel=null;S.tab=null;};
A.tab=function(d){S.tab=d.t;if(d.t==="signins"&&S.sel==="u1"){S.flags.viewedLogs=true;}};
A.flyTab=function(d){if(S.fly){S.fly.tab=d.t;}};
A.closeFly=function(){S.fly=null;};
A.closeModal=function(){closeModal();};
A.chk=function(d){S.checked=S.checked[0]===d.id?[]:[d.id];};
A.refresh=function(){toast("Refreshed.");};
A.noop=function(){toast("Not needed for this lab.");};
A.perUserMfa=function(){openModal("Per-user MFA","<p>Per-user MFA is the older way to enforce MFA one person at a time. Use security defaults or Conditional Access instead (Entra > Protection or Properties).</p>",null,null);};
A.guide=function(){S.guide=!S.guide;};
A.gtab=function(d){S.guideTab=d.t;};
A.info=function(d,el){hidePop();showPop(el);};
A.wizGo=function(d){S.wiz.step=parseInt(d.n,10);S.wiz.err="";};
A.wizBack=function(){S.wiz.step=Math.max(0,S.wiz.step-1);S.wiz.err="";};
A.wizNext=function(){var def=WIZ[S.wiz.kind];S.wiz.step=Math.min(def.steps.length-1,S.wiz.step+1);S.wiz.err="";};
A.wizCancel=function(){S.wiz=null;};
A.wizCreate=function(){var def=WIZ[S.wiz.kind],r=def.create(S.wiz.d);if(r&&r.error){S.wiz.err=r.error;return;}S.wiz=null;S.checked=[];toast(r&&r.msg?r.msg:"Created.");};
A.resetLab=function(){openModal("Reset the lab?","<p>This restores every user, group, license, device and policy to the starting state and clears mission progress.</p>","Reset lab",function(){S=seed();S.onboarded=true;toast("Lab reset.");return null;});};
A.tour=function(){S.onboarded=false;S.intro=0;};
A.introNext=function(){S.intro=Math.min(INTRO_STEPS-1,(S.intro||0)+1);};
A.introBack=function(){S.intro=Math.max(0,(S.intro||0)-1);};
A.introSkip=function(){S.onboarded=true;if(progress()[0]===0){S.guide=true;S.guideTab="missions";}};
A.introStart=function(){
  var m=nextMission(levelsView());
  S.onboarded=true;S.guide=true;S.guideTab="missions";
  if(m){var st=firstOpenStep(m),w=st[2];S.portal=w[0];S.page=w[1];resetNav();window.scrollTo(0,0);}
};
A.finish=function(){S.finishSeen=false;};
A.finishClose=function(){S.finishSeen=true;};
A.finishReset=function(){S.finishSeen=true;A.resetLab();};

/* =============== RENDER =============== */
function fitLaptop(){
  var el=document.getElementById("laptop");
  if(!el){return;}
  var w=el.clientWidth,h=window.innerHeight||800;
  if(!w){return;}
  var sc=Math.min(w/960,1.15,Math.max(0.5,(h-210)/580));
  sc=Math.max(0.5,sc);
  el.style.setProperty("--s",String(Math.round(sc*1000)/1000));
}
function render(){
  hidePop();recompute();
  document.body.dataset.portal=S.portal;
  var key=S.portal+"."+S.page,content;
  if(S.portal==="vm"){content=vmPage();}
  else if(S.wiz){content=wizHtml();}
  else if(PAGES[key]){content=PAGES[key]();}
  else{content='<p>Page not found.</p>';}
  var qf=document.activeElement&&document.activeElement.id==="q",pos=qf?document.activeElement.selectionStart:0;
  $("#app").innerHTML=labBar()+portalHeader()+'<div class="shell">'+leftNav()+'<main class="content" id="main">'+content+'</main></div>'+flyHtml()+guideHtml();
  if(qf){var q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}
  document.body.classList.toggle("guide-open",!!S.guide);
  fitLaptop();
  /* level completion toast, then the tour or the finish screen */
  var lv=levelsView(),fresh=null;
  lv.forEach(function(L){var i=S.lvlDone.indexOf(L.n);if(L.complete&&i<0){S.lvlDone.push(L.n);fresh=L;}if(!L.complete&&i>-1){S.lvlDone.splice(i,1);}});
  if(fresh&&S.onboarded){toast("Level "+fresh.n+" complete: "+fresh.name+".");}
  var allDone=lv.every(function(L){return L.complete;}),ov=$("#intro"),app=$("#app");
  if(!S.onboarded){ov.innerHTML=introHtml();}
  else if(allDone&&!S.finishSeen){ov.innerHTML=finishHtml();}
  else{ov.innerHTML="";}
  if(ov.innerHTML){app.setAttribute("inert","");var pb=ov.querySelector(".btn.primary");if(pb&&!ov.contains(document.activeElement)){pb.focus();}}
  else{app.removeAttribute("inert");}
  save();
}

/* =============== EVENTS =============== */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");
  if(!t){if(!e.target.closest("#pop")){hidePop();}return;}
  if(t.disabled){return;}
  var name=t.dataset.a,f=A[name];
  if(!f){return;}
  if(name==="chk"){f(t.dataset,t);render();return;}
  f(t.dataset,t);
  if(!NR[name]){render();}
});
document.addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest(".i");if(t&&t!==popFor){hidePop();showPop(t);}});
document.addEventListener("submit",function(e){
  if(e.target.id!=="mf"){return;}
  e.preventDefault();
  var fd={};new FormData(e.target).forEach(function(v,k){fd[k]=v;});
  var r=modalSubmit?modalSubmit(fd):null;
  if(r&&r.error){$("#merr").textContent=r.error;return;}
  closeModal();render();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute("data-vi")){S.vmIn[t.getAttribute("data-vi")]=t.value;return;}
  if(t.hasAttribute&&t.hasAttribute("data-q")){S.q=t.value;S.checked=[];render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-w")&&t.type==="text"&&S.wiz){S.wiz.d[t.getAttribute("data-w")]=t.value;}
});
document.addEventListener("change",function(e){
  var t=e.target,rr=false;
  if(!t.hasAttribute){return;}
  if(t.hasAttribute("data-w")&&S.wiz){
    var f=t.getAttribute("data-w");
    S.wiz.d[f]=t.type==="checkbox"?t.checked:t.value;
    if(S.wiz.kind==="app"&&f==="type"){S.wiz.d.name=t.value;}
    rr=t.hasAttribute("data-rr")||t.type==="radio"||t.type==="checkbox"||t.tagName==="SELECT";
  }else if(t.hasAttribute("data-wg")&&S.wiz){
    var g=t.getAttribute("data-wg"),arr=S.wiz.d.groups||[],i=arr.indexOf(g);
    if(t.checked&&i<0){arr.push(g);}if(!t.checked&&i>-1){arr.splice(i,1);}S.wiz.d.groups=arr;
  }else if(t.hasAttribute("data-fd")&&S.fly){
    S.fly.d[t.getAttribute("data-fd")]=t.type==="checkbox"?t.checked:t.value;rr=t.hasAttribute("data-rr");
  }else if(t.hasAttribute("data-dr")&&S.draft){
    S.draft[t.getAttribute("data-dr")]=t.value;rr=t.hasAttribute("data-rr");
  }else if(t.hasAttribute("data-sv")){
    S[t.getAttribute("data-sv")]=t.value;
  }
  if(rr){render();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.hasAttribute&&e.target.hasAttribute("data-enter")){var fn=A[e.target.getAttribute("data-enter")];if(fn){e.preventDefault();fn({},e.target);render();}return;}
  if(e.key!=="Escape"){return;}
  if(!$("#modal").hidden){closeModal();}else if(popFor){hidePop();}else if(!S.onboarded){A.introSkip();render();}else if(!$("#intro").hidden&&$("#intro").firstChild){A.finishClose();render();}else if(S.fly){S.fly=null;render();}
});
window.addEventListener("scroll",function(){if(popFor){hidePop();}},true);
window.addEventListener("resize",fitLaptop);
/* Saved labs from before the tour existed: add the new fields, and don't show the tour to someone who already has progress. */
if(S.lvlDone===undefined){S.lvlDone=levelsView().filter(function(L){return L.complete;}).map(function(L){return L.n;});}
if(S.intro===undefined){S.intro=0;}
if(S.finishSeen===undefined){S.finishSeen=false;}
if(S.onboarded===undefined){S.onboarded=progress()[0]>0;S.finishSeen=levelsView().every(function(L){return L.complete;});}
render();
})();
</script>
</body>
</html>
