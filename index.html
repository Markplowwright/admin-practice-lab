<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Practice Lab: Microsoft 365, Entra, Intune, Exchange</title>
<script>
(function(){
  var root=document.documentElement,mq=window.matchMedia("(prefers-color-scheme: dark)");
  function apply(){
    var choice=root.getAttribute("data-theme-choice");
    var dark=choice==="dark"||(choice!=="light"&&mq.matches);
    root.setAttribute("data-theme",dark?"dark":"light");
  }
  apply();
  if(mq.addEventListener){mq.addEventListener("change",apply);}
})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-portal="m365">
<div id="app"></div>
<div id="intro"></div>
<div id="pop" role="tooltip" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/rules.js"></script>

</html>
